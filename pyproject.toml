[project]
name = "snapmaker-u1-mcp"
version = "0.1.0"
description = "Lightweight MCP server for Snapmaker U1 headless slicing with Snapmaker Orca"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7", "pytest-cov>=5"]

[project.scripts]
snapmaker-u1-mcp = "snapmaker_u1_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapmaker_u1_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
